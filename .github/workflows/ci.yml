name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint, type check, gates, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gates (dashes, red, hype, patient, typecheck, lint)
        run: npm run ci

      - name: Smoke test fixtures
        run: npm run smoke:fixtures

      - name: Smoke test appointment filters
        run: npm run smoke:filters

      - name: Build
        run: npm run build
