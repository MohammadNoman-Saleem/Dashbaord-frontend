<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saleem panel setup</title>
    <style>
      /* ============ Saleem design tokens ============
         Exact mirror of styles/tokens.css. Kept in sync by hand with the block in
         panel.html (the extension has no build step). Colours may live inline in
         .html because CI (scripts/check-red.mjs) scans .ts/.tsx/.css only. */
      :root {
        color-scheme: light dark;
        --bg: #f2f1f0;
        --surface: #ffffff;
        --surface-2: #f7f7f6;
        --ink: #000000;
        --ink-2: rgba(7, 58, 79, 0.66);
        --ink-3: rgba(7, 58, 79, 0.45);
        --title: #073a4f;
        --accent: #588be4;
        --accent-text: #3667c5;
        --recovery: #2e7d67;
        --line: rgba(7, 58, 79, 0.12);
        --shadow: 0 1px 2px rgba(7, 58, 79, 0.04), 0 10px 28px -18px rgba(7, 58, 79, 0.22);
        --r: 16px;
        --r-sm: 10px;
        --on-accent: #ffffff;
        --trust-ink: #073a4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #061f2a;
          --surface: #0a2a39;
          --surface-2: #0d3142;
          --ink: #f2f1f0;
          --ink-2: rgba(208, 228, 238, 0.72);
          --ink-3: rgba(208, 228, 238, 0.48);
          --title: #eaf3f7;
          --accent: #6f9eea;
          --accent-text: #9dbdf2;
          --recovery: #5fb393;
          --line: rgba(174, 214, 228, 0.16);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 12px 30px -18px rgba(0, 0, 0, 0.55);
        }
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('fonts/inter.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Libre Baskerville';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/libre-baskerville.woff2') format('woff2');
      }

      * { box-sizing: border-box; }
      body {
        font: 400 14px/1.55 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 16px;
      }
      .card {
        width: 100%; max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .brand .mark {
        width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
        color: var(--on-accent); font-weight: 700; font-size: 14px;
        display: grid; place-items: center; flex: none;
      }
      h1 { font-family: 'Libre Baskerville', Georgia, serif; font-weight: 400; color: var(--title); font-size: 19px; margin: 0; }
      .hint { color: var(--ink-2); font-size: 12px; margin: 8px 0 4px; }
      label { display: block; margin: 16px 0 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
      input {
        width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm);
        font: inherit; background: var(--surface); color: var(--ink);
      }
      input:hover { border-color: var(--ink-3); }
      input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button {
        margin-top: 20px; width: 100%; padding: 10px 14px; border: 0; border-radius: var(--r-sm);
        background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
        cursor: pointer; box-shadow: var(--shadow); transition: filter .12s ease;
      }
      button:hover { filter: brightness(1.04); }
      button:active { filter: brightness(0.97); }
      .status { margin-top: 16px; font-size: 13px; min-height: 18px; color: var(--ink-2); }
      ::selection { background: var(--accessible, #aed6e4); color: var(--trust-ink); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">S</span>
        <h1>Saleem panel setup</h1>
      </div>
      <p class="hint">Signs in to your dashboard backend and stores a session token for the panel. The token is kept only in this browser; no password is stored.</p>

      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" type="text" value="http://localhost:3000" />

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <button id="save">Sign in</button>
      <div class="status" id="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
