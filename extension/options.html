<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saleem panel setup</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; color: #1a1f24; }
      h1 { font-size: 18px; }
      label { display: block; margin: 12px 0 4px; font-size: 13px; color: #667085; }
      input { width: 100%; padding: 8px; border: 1px solid #d7dbe0; border-radius: 6px; font: inherit; }
      button { margin-top: 16px; padding: 9px 14px; border: 0; border-radius: 6px; background: #0b6b5f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
      .hint { color: #667085; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Saleem panel setup</h1>
    <p class="hint">Signs in to your dashboard backend and stores a session token for the panel. The token is kept only in this browser; no password is stored.</p>

    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" value="http://localhost:3000" />

    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <button id="save">Sign in</button>
    <div class="status" id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
